name: prebuilt

on:
  push:
    branches: [prebuilt, codex/occt-planarity]
  workflow_dispatch:

concurrency:
  group: occt-prebuilt-release
  cancel-in-progress: false

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate source patch
        run: |
          rustc --edition=2021 --test tests/occt_source_patch.rs -o /tmp/occt-source-patch-tests
          /tmp/occt-source-patch-tests
          python3 tests/prebuilt_manifest_test.py

  # The following prebuilt OCCT tarballs are cross-built via Docker (make cross-<target> GOAL=occt):
  #   - x86_64-unknown-linux-gnu
  #   - aarch64-unknown-linux-gnu
  #   - x86_64-pc-windows-gnu
  #   - wasm32-unknown-unknown
  # This is because the cross toolchain for these targets is mature on the Linux
  # side (cross-gcc / mingw-w64 / wasi-sdk clang), so Docker gives a reproducible
  # build host.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: x86_64-pc-windows-gnu
            runs-on: ubuntu-latest
          - target: wasm32-unknown-unknown
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make cross-${{ matrix.target }} GOAL=occt

      - name: Verify Linux extrusion planarity
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/occt"
          tar -xzf out/${{ matrix.target }}/occt-*.tar.gz -C "$RUNNER_TEMP/occt"
          occt_root=("$RUNNER_TEMP"/occt/occt-*)
          cmake -S tests/occt-planarity -B "$RUNNER_TEMP/planarity" \
            -DOCCT_ROOT="${occt_root[0]}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/planarity" --config Release
          ctest --test-dir "$RUNNER_TEMP/planarity" -C Release --output-on-failure

      - name: Verify packaged WebAssembly extrusion planarity
        if: matrix.target == 'wasm32-unknown-unknown'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/occt-wasm"
          tar -xzf out/${{ matrix.target }}/occt-*.tar.gz -C "$RUNNER_TEMP/occt-wasm"
          occt_root=("$RUNNER_TEMP"/occt-wasm/occt-*)
          package_name=$(basename "${occt_root[0]}")
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/tests/occt-planarity:/probe:ro" \
            -v "$RUNNER_TEMP/occt-wasm:/qualification" \
            cross-wasm32-unknown-unknown \
            /probe/build-wasm.sh "/qualification/$package_name" /qualification/planarity.wasm
          node tests/occt-planarity/run-wasi.mjs "$RUNNER_TEMP/occt-wasm/planarity.wasm"

      - name: Build packaged Windows GNU planarity probe
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/occt-windows"
          tar -xzf out/${{ matrix.target }}/occt-*.tar.gz -C "$RUNNER_TEMP/occt-windows"
          occt_root=("$RUNNER_TEMP"/occt-windows/occt-*)
          package_name=$(basename "${occt_root[0]}")
          docker run --rm \
            -v "$PWD/tests/occt-planarity:/probe:ro" \
            -v "$RUNNER_TEMP/occt-windows:/qualification" \
            cross-x86_64-pc-windows-gnu \
            cmake -S /probe -B /qualification/build \
            -DOCCT_ROOT="/qualification/$package_name" -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          docker run --rm \
            -v "$PWD/tests/occt-planarity:/probe:ro" \
            -v "$RUNNER_TEMP/occt-windows:/qualification" \
            cross-x86_64-pc-windows-gnu \
            cmake --build /qualification/build --config Release

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-pc-windows-gnu'
        with:
          name: planarity-windows-gnu
          path: ${{ runner.temp }}/occt-windows/build/occt_planarity.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: occt-${{ matrix.target }}
          path: out/${{ matrix.target }}/occt-*.tar.gz

  verify-windows-gnu:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: planarity-windows-gnu
          path: planarity
      - name: Execute packaged Windows GNU extrusion planarity
        shell: pwsh
        run: |
          & ./planarity/occt_planarity.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The following prebuilt OCCT tarball is built on a native Windows runner with
  # native cl.exe (make occt):
  #   - x86_64-pc-windows-msvc
  # This is because prebuilding via cargo-xwin/clang-cl makes COMDAT emission
  # decisions for MSVC STL templates that disagree with native cl.exe, producing
  # `std::_Variant_storage_<...>` unresolved symbols at the user's link step
  # (issue #73). A native build does not cross that ABI boundary.
  build-windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1

      - name: install make
        run: choco install make -y

      # Git for Windows ships a GNU coreutils `link.exe` at /usr/bin/link.exe
      # which shadows MSVC's `link.exe` when rustc drives the linker from a
      # bash shell (bash prepends /usr/bin to PATH before msvc-dev-cmd's
      # additions take effect). Remove it so rustc resolves MSVC's linker.
      - name: unshadow MSVC link.exe
        shell: bash
        run: rm -f /usr/bin/link /usr/bin/link.exe

      - name: build
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: make occt

      - name: Verify Windows extrusion planarity
        shell: bash
        run: |
          occt_root=("$PWD"/target/occt-*)
          cmake -S tests/occt-planarity -B out/planarity -DOCCT_ROOT="${occt_root[0]}"
          cmake --build out/planarity --config Release
          ctest --test-dir out/planarity -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: occt-x86_64-pc-windows-msvc
          path: out/occt-*.tar.gz

  # The following prebuilt OCCT tarballs are built on native macOS runners with Apple
  # clang/libc++ (make occt):
  #   - aarch64-apple-darwin
  #   - x86_64-apple-darwin
  # This is because this repo has no Docker/osxcross apple-darwin toolchain, and
  # Apple's SDK + clang are simplest (and license-clean) on real Apple hardware,
  # which GitHub provides as free runners. macOS libc++ has a stable ABI, so this
  # is NOT the ABI-forced choice that windows-msvc is.
  # macos-14 = Apple Silicon (aarch64); macos-15-intel = Intel (x86_64).
  # NOTE: macos-13 (the old Intel label) was retired on 2025-12-04, so we use its
  #       successor macos-15-intel. https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/
  # cmake / make / clang are preinstalled on the GitHub macOS runner.
  # CADRUM_BUNDLE_RUNTIME=1 inside `make occt` is a no-op on Darwin
  # (build.rs bundles libstdc++/libgcc only for *-windows-gnu / *-linux-gnu).
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: make occt

      - name: Verify macOS extrusion planarity
        shell: bash
        run: |
          occt_root=("$PWD"/target/occt-*)
          cmake -S tests/occt-planarity -B out/planarity \
            -DOCCT_ROOT="${occt_root[0]}" -DCMAKE_BUILD_TYPE=Release
          cmake --build out/planarity --config Release
          ctest --test-dir out/planarity -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: occt-${{ matrix.target }}
          path: out/occt-*.tar.gz

  release:
    needs: [patch-contract, build, build-windows-msvc, build-macos, verify-windows-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Record complete package set and refuse published-release replacement
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/prebuilt_manifest.py dist "$GITHUB_SHA")
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp)
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false)' <<< "$releases" > /dev/null; then
            echo "Release $tag is already public; increment BUILD_REVISION before creating new packages." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.packages.outputs.tag }}
          name: OCCT prebuilt v8.0.0 (Cadona 1)
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/BUILD_INFO.json
            dist/SHA256SUMS
